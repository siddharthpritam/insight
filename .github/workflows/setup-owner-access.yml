name: Set up Insight owner login
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: insight-owner-access-setup
  cancel-in-progress: false

jobs:
  setup:
    if: github.repository == 'siddharthpritam/insight' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check setup safety
        run: node --test scripts/setup-owner-access.test.mjs
      - name: Configure and verify owner-only access
        env:
          CLOUDFLARE_ACCESS_SETUP_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_SETUP_TOKEN }}
        run: node scripts/setup-owner-access.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: insight-owner-access
          path: /tmp/insight-owner-access.json
          retention-days: 1
